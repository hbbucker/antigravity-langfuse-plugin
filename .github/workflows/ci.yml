name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "langfuse>=2.50.0"

      - name: Check Node.js syntax
        run: |
          node --check scripts/run_tracer.mjs
          node --check scripts/setup.mjs

      - name: Check Python compilation
        run: |
          python -m py_compile scripts/langfuse_tracer.py
          python -m py_compile scripts/provision_dashboard.py

      - name: Test path normalization & config resolution
        run: |
          python -c "import sys; sys.path.append('scripts'); from langfuse_tracer import normalize_path_separators, detect_startupos_context; assert normalize_path_separators('a\\\\b\\\\c') == 'a/b/c'; print('Path normalization test passed!')"
